server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 dataaha.local;
    absolute_redirect off;

    root /app;
    index Default.aspx;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ @mono;
    }

    location ~* \.(aspx|ashx)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app$fastcgi_script_name;
        fastcgi_param PATH_INFO "";
        fastcgi_param APPL_PHYSICAL_PATH /app;
        fastcgi_param APPL_MD_PATH /;
        fastcgi_param DOCUMENT_ROOT /app;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT 80;
        fastcgi_param HTTPS off;
        fastcgi_pass unix:/run/mono/fastcgi.sock;
    }

    location @mono {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/Default.aspx;
        fastcgi_param PATH_INFO "";
        fastcgi_param APPL_PHYSICAL_PATH /app;
        fastcgi_param APPL_MD_PATH /;
        fastcgi_param DOCUMENT_ROOT /app;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT 80;
        fastcgi_param HTTPS off;
        fastcgi_pass unix:/run/mono/fastcgi.sock;
    }
}

server {
    listen 443 ssl;
    server_name localhost 127.0.0.1 dataaha.local;
    absolute_redirect off;

    ssl_certificate /etc/nginx/certs/dataaha.local.pem;
    ssl_certificate_key /etc/nginx/certs/dataaha.local-key.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /app;
    index Default.aspx;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ @mono_https;
    }

    location ~* \.(aspx|ashx)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app$fastcgi_script_name;
        fastcgi_param PATH_INFO "";
        fastcgi_param APPL_PHYSICAL_PATH /app;
        fastcgi_param APPL_MD_PATH /;
        fastcgi_param DOCUMENT_ROOT /app;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/mono/fastcgi.sock;
    }

    location @mono_https {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/Default.aspx;
        fastcgi_param PATH_INFO "";
        fastcgi_param APPL_PHYSICAL_PATH /app;
        fastcgi_param APPL_MD_PATH /;
        fastcgi_param DOCUMENT_ROOT /app;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/mono/fastcgi.sock;
    }
}
